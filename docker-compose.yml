services:
  app:
    build: ./board
    container_name: board-app
    env_file:
      - .env
    depends_on:
      - redis
    expose:
      - "8080"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: board-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: board-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: unless-stopped

volumes:
  redis-data:
